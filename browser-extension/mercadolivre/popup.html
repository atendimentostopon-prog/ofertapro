<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Aflyo — Mercado Livre</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 300px; padding: 16px; margin: 0; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
    h1 img { width: 18px; height: 18px; border-radius: 4px; }
    p.sub { font-size: 11px; color: #666; margin: 0 0 14px; }
    label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
    button { width: 100%; padding: 9px; font-size: 12px; font-weight: 700; border: none; border-radius: 8px; background: #10b981; color: white; cursor: pointer; margin-bottom: 8px; }
    button.secondary { background: #f5f5f5; color: #333; }
    button.danger { background: #fef2f2; color: #b91c1c; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 4px; font-size: 11px; padding: 8px; border-radius: 8px; background: #f5f5f5; line-height: 1.4; }
    #status.ok { background: #ecfdf5; color: #047857; }
    #status.error { background: #fef2f2; color: #b91c1c; }
    #cookieCount { font-size: 10px; color: #999; margin-top: 6px; text-align: center; }
    .actions { display: none; }
    .actions.visible { display: block; margin-top: 10px; }
    footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid #eee; text-align: center; }
    footer a { font-size: 10.5px; color: #059669; text-decoration: none; font-weight: 600; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Aflyo — Mercado Livre</h1>
  <p class="sub">Conecte pra gerar links de afiliado automaticamente.</p>

  <div id="connectForm">
    <label for="apiKey">Sua API Key do Aflyo</label>
    <input id="apiKey" type="password" placeholder="lof_live_..." />
    <button id="connectBtn">Conectar</button>
  </div>

  <div id="status">Verificando status...</div>
  <div id="cookieCount"></div>

  <div id="actions" class="actions">
    <button id="syncBtn" class="secondary">Sincronizar agora</button>
    <button id="disconnectBtn" class="danger">Desconectar</button>
  </div>

  <footer>
    <a href="https://www.aflyo.com.br/automatizacao-mercadolivre" target="_blank" rel="noopener noreferrer">Como funciona / instruções</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
